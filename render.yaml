# Render Blueprint for the Python agent backend (agent/). Free plan; nothing is
# created until you import this blueprint on render.com. See agent/README.md.
services:
  - type: web
    name: moizali-agent
    runtime: docker
    plan: free
    dockerfilePath: ./agent/Dockerfile
    dockerContext: .
    healthCheckPath: /healthz
    autoDeploy: true
    buildFilter:
      paths:
        - agent/**
        - content/**
    envVars:
      - key: LLM_PROVIDER
        value: gemini
      - key: AGENT_MODEL
        value: gemini-3.5-flash-lite
      - key: AGENT_FALLBACK_MODELS
        value: gemini-3.5-flash,gemini-flash-latest
      - key: GEMINI_API_KEY
        sync: false
      - key: AGENT_SHARED_SECRET
        generateValue: true
      - key: RESEND_API_KEY
        sync: false
      - key: CALENDLY_TOKEN
        sync: false
